name: Deploy STORM Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from Bun lockfile
        run: bun install --frozen-lockfile

      - name: Build static portfolio
        env:
          GITHUB_PAGES: "true"
        run: bun run build

      - name: Verify static output
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "::error::The build did not produce .output/public/index.html."
            echo "Build output directories:"
            ls -la .output dist 2>/dev/null || true
            find .output -maxdepth 4 -name index.html -print 2>/dev/null || true
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

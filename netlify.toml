# STORM portfolio: Netlify deployment using TanStack Start + Nitro SSR.
# The Lovable build and GitHub Pages prerender build are configured separately.
# Nitro detects Netlify and generates its server function plus static assets.

[build]
  command = "bun install --frozen-lockfile && bun run build && test -d dist/assets"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# Do not add a blanket /* -> /index.html redirect here:
# Nitro generates the routing needed to serve SSR via Netlify Functions.
